name: gerenciador_tarefas
description: Aplicativo mobile para gerenciamento inteligente de tarefas com Clean Architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Banco de dados local (SQL via Drift)
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Navegação declarativa
  go_router: ^14.0.0

  # Injeção de dependência
  get_it: ^8.0.0
  injectable: ^2.5.0

  # Gerência de estado (MVVM com ChangeNotifier)
  provider: ^6.1.0

  # Utilitários
  intl: ^0.20.0
  uuid: ^4.5.0
  equatable: ^2.0.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Geração de código (Drift e Injectable)
  drift_dev: ^2.22.0
  build_runner: ^2.4.0
  injectable_generator: ^2.6.0

flutter:
  uses-material-design: true
